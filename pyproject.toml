[project]
name = "iconpilot"
version = "0.0.1"
description = "Multi-model pipeline for designing consistent SVG icon packs"
readme = "README.md"
license = "MIT"
authors = [{ name = "BurgDev" }]
requires-python = ">=3.12"
dependencies = [
    # CLI + schema validation (available now)
    "typer>=0.12",
    "jsonschema>=4.23",
    # Gate: parsing, geometry, deterministic rendering, similarity
    "lxml>=5.2",
    "svgpathtools>=1.6",
    "resvg-py>=0.5.0",
    "imagehash>=4.3.2",
]

[project.scripts]
iconpilot = "iconpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/iconpilot/cli.py" = ["B008"]          # typer.Option in defaults is the typer idiom
"src/iconpilot/server/server.py" = ["BLE001", "A002"]  # HTTP handlers; base-class param name

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1a23"]
docs = ["zensical>=0.0.70"]

[tool.hatch.build.targets.wheel]
packages = ["src/iconpilot"]
