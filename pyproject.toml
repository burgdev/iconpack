[project]
name = "iconpilot"
version = "0.0.1"
description = "Multi-model pipeline for designing consistent SVG icon packs"
readme = "README.md"
license = "MIT"
authors = [{ name = "BurgDev" }]
requires-python = ">=3.12"
dependencies = [
    # CLI + schema validation (available now)
    "typer>=0.12",
    "jsonschema>=4.23",
    # Gate/render foundations (M1) — import lazily until milestones land
    "lxml>=5.2",
    "svgpathtools>=1.6",
    # resvg-py and imagehash are added with the M1/M2 implementations,
    # together with their pinned versions.
]

[project.scripts]
iconpilot = "iconpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/iconpilot"]
