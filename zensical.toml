[project]
site_url = "https://burgdev.github.io/iconpilot/"
site_name = "iconpilot"
site_description = "Deterministic tooling + state for designing consistent SVG icon packs — the AI agent is the model layer."
site_author = "BurgDev"
copyright = "Copyright &copy; 2026 BurgDev"
repo_url = "https://github.com/burgdev/iconpilot"
repo_name = "burgdev/iconpilot"
edit_uri = "edit/main/docs/"

nav = [
  { "Get started" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Concepts" = "concepts.md" },
  { "The agent loop" = "loop.md" },
  { "Improving existing packs" = "improving.md" },
  { "CLI reference" = "cli.md" },
  { "Library API" = "library.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
]
palette = [
  { media = "(prefers-color-scheme)", toggle = { icon = "material/brightness-auto", name = "Switch to light mode" } },
  { media = "(prefers-color-scheme: light)", scheme = "default", toggle = { icon = "material/weather-night", name = "Switch to dark mode" } },
  { media = "(prefers-color-scheme: dark)", scheme = "dark", toggle = { icon = "material/weather-sunny", name = "Switch to light mode" } },
]
