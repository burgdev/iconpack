name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  repository_dispatch:
    types: [new-tag-created]

jobs:
  publish:
    if: false  # disabled until the PyPI environment + trusted publisher exist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
