name: Build Docker

# ghcr.io/burgdev/iconpilot — headless export image.
# Only builds on main when the merged PR carries a "BUILD" label;
# tag pushes, dispatches, and manual runs always build.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  repository_dispatch:
    types: [new-tag-created]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for BUILD label on main branch
        id: label
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('build', 'true'); return;
            }
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const labels = prs.data.flatMap(pr => pr.labels.map(l => l.name));
            core.setOutput('build', labels.includes('BUILD') ? 'true' : 'false');

      - name: Set up Docker Buildx
        if: github.ref != 'refs/heads/main' || steps.label.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.ref != 'refs/heads/main' || steps.label.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.ref != 'refs/heads/main' || steps.label.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge,branch=main

      - name: Build and push
        if: github.ref != 'refs/heads/main' || steps.label.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
